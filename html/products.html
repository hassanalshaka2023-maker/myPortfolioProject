<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حسان الشيخة | المتجر</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        *{margin:0;padding:0;}
        body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#f5f7fb;}
        .card{border:none;border-radius:20px;transition:0.3s;background:white;}
        .card:hover{transform:translateY(-5px);}
        .btn{border-radius:30px;}
        .btn-success{background:linear-gradient(135deg,#11998e,#38ef7d);border:none;}
        .bg-gradient-warning{background:linear-gradient(135deg,#f6d365,#fda085);}
        footer{background:#1a1a2e;color:white;text-align:center;padding:20px;}
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><i class="fas fa-code"></i> حسان الشيخة</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="portfolio.html">السيرة الذاتية</a></li>
                    <li class="nav-item"><a class="nav-link" href="blog.html">المدونة</a></li>
                    <li class="nav-item"><a class="nav-link" href="products.html">المتجر</a></li>
                    <li class="nav-item"><a class="nav-link" href="calculator.html">الحاسبة</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">استشارة</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="bg-gradient-warning text-dark text-center py-5">
        <div class="container">
            <h1 class="display-5"><i class="fas fa-store"></i> متجر المنتجات الوهمي</h1>
            <p>أضف المنتجات إلى سلة التسوق</p>
        </div>
    </header>

    <main class="container my-5">
        <div class="text-center mb-4">
            <div class="card d-inline-block p-3">
                <h4><i class="fas fa-shopping-cart"></i> عدد المنتجات: <span id="cartCount" class="badge bg-primary fs-5">0</span></h4>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-md-6 col-lg-3">
                <div class="card text-center p-3">
                    <i class="fas fa-laptop fa-3x text-primary mb-2"></i>
                    <h5>لابتوب احترافي</h5>
                    <p class="text-danger fw-bold">$899</p>
                    <button class="btn btn-success addBtn" data-product="لابتوب">➕ أضف</button>
                </div>
            </div>
            <div class="col-md-6 col-lg-3">
                <div class="card text-center p-3">
                    <i class="fas fa-mouse fa-3x text-secondary mb-2"></i>
                    <h5>ماوس لاسلكي</h5>
                    <p class="text-danger fw-bold">$29</p>
                    <button class="btn btn-success addBtn" data-product="ماوس">➕ أضف</button>
                </div>
            </div>
            <div class="col-md-6 col-lg-3">
                <div class="card text-center p-3">
                    <i class="fas fa-keyboard fa-3x text-dark mb-2"></i>
                    <h5>كيبورد ميكانيكي</h5>
                    <p class="text-danger fw-bold">$79</p>
                    <button class="btn btn-success addBtn" data-product="كيبورد">➕ أضف</button>
                </div>
            </div>
            <div class="col-md-6 col-lg-3">
                <div class="card text-center p-3">
                    <i class="fas fa-headphones fa-3x text-info mb-2"></i>
                    <h5>سماعات لاسلكية</h5>
                    <p class="text-danger fw-bold">$59</p>
                    <button class="btn btn-success addBtn" data-product="سماعات">➕ أضف</button>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2026 - متجر حسان الشيخة</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let count = 0;
        const cartSpan = document.getElementById('cartCount');
        document.querySelectorAll('.addBtn').forEach(btn=>{
            btn.addEventListener('click',function(){
                count++;
                cartSpan.innerText = count;
                alert('✅ تم إضافة '+this.getAttribute('data-product')+' إلى السلة');
            });
        });
    </script>
</body>
</html>
